name: Build OCBoost (RootHide)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid dpkg xz

      # The official installer calls install-sdk latest, which queries the
      # GitHub Releases API and may fail on API/rate-limit errors. Clone Theos
      # directly, then fetch the exact SDK asset by release URL below.
      - name: Clone RootHide Theos without SDK auto-installer
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euxo pipefail
          git clone --depth 1 --recurse-submodules https://github.com/roothide/theos.git "$THEOS"
          test -f "$THEOS/makefiles/common.mk"
          echo "Theos makefiles are present."

      # Xcode's SDK omits private framework stubs; Preferences.framework is
      # needed to link the Settings preference bundle.
      - name: Install patched iOS 16.5 SDK
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euxo pipefail
          mkdir -p "$THEOS/sdks"
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz
          tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz -C "$THEOS/sdks"
          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/Preferences.framework/Preferences.tbd"
          echo "Patched Preferences framework stub found."
          du -sh "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Build RootHide deb (arm64 + arm64e)
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euxo pipefail
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          ls -lah packages/*.deb

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: OCBoost-RootHide-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Attach deb to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
